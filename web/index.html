    (function () {
      var p = localStorage.getItem("ggok-theme");
      var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
      var side = localStorage.getItem("ggok-sidebar");
      if (side === "collapsed") {
        document.documentElement.dataset.sidebar = "collapsed";
      }
      var stored;
      try { stored = localStorage.getItem("ggok-lang"); } catch (e) { stored = null; }
      var lang;
      if (stored === "zh" || stored === "en") lang = stored;
      else {
        var n = ((navigator.languages && navigator.languages[0]) || navigator.language || "").toLowerCase();
        lang = n.indexOf("zh") === 0 ? "zh" : "en";
      }
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.documentElement.dataset.lang = lang;
      if (lang !== "zh") {
        document.documentElement.dataset.i18nPending = "1";
        setTimeout(function () {
          document.documentElement.removeAttribute("data-i18n-pending");
        }, 2000);
      }
    })();
  </script>

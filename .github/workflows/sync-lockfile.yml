name: Sync Cargo.lock version

on:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: write

jobs:
  sync:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align Cargo.lock with workspace version
        run: python3 .github/scripts/release/sync-workspace-lock-version.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --staged --quiet; then
            echo "Cargo.lock unchanged"
            exit 0
          fi
          git commit -m "chore: sync Cargo.lock workspace versions"
          git push
